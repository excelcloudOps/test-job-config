name: Build and Publish to Nexus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional Maven version override (e.g. 1.0.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_RAW_REPO: ${{ vars.NEXUS_RAW_REPO || 'raw-release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Normalize Nexus URL
        run: echo "NEXUS_URL=${NEXUS_URL%/}" >> "$GITHUB_ENV"

      - name: Verify Nexus credentials and raw-release repo
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_URL}" ] || [ -z "${NEXUS_USERNAME}" ] || [ -z "${NEXUS_PASSWORD}" ]; then
            echo "::error::NEXUS_URL, NEXUS_USERNAME, and NEXUS_PASSWORD secrets must be set"
            exit 1
          fi

          echo "Checking Nexus status at ${NEXUS_URL}"
          status_code=$(curl -sS -o /tmp/nexus-status.json -w "%{http_code}" \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            "${NEXUS_URL}/service/rest/v1/status" || true)
          echo "Status endpoint HTTP ${status_code}"
          if [ "${status_code}" != "200" ]; then
            echo "::error::Nexus status check failed (HTTP ${status_code}). Check NEXUS_URL and credentials."
            cat /tmp/nexus-status.json || true
            exit 1
          fi

          curl -sS -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            "${NEXUS_URL}/service/rest/v1/repositories" \
            -o /tmp/nexus-repos.json

          echo "Raw hosted repositories visible to this user:"
          python3 - <<'PY'
          import json, os, sys
          repos = json.load(open("/tmp/nexus-repos.json"))
          raw_hosted = [
              r for r in repos
              if r.get("format") == "raw" and r.get("type") == "hosted"
          ]
          for r in sorted(raw_hosted, key=lambda x: x["name"]):
              print(f"  - {r['name']} ({r.get('url', '')})")

          target = os.environ["NEXUS_RAW_REPO"]
          names = {r["name"] for r in raw_hosted}
          if target not in names:
              print(
                  f"::error::Configured repo '{target}' not found as raw hosted. "
                  "Create it in Nexus or set NEXUS_RAW_REPO."
              )
              sys.exit(1)
          print(f"Target raw repo OK: {target}")
          PY

      - name: Override version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: >
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="${{ inputs.version }}"
          -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Publish JAR to Nexus raw-release
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          GROUP_PATH=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId | tr '.' '/')
          JAR="target/${ARTIFACT_ID}-${VERSION}.jar"
          DIRECTORY="/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}"

          if [ ! -f "${JAR}" ]; then
            echo "::error::Built JAR not found at ${JAR}"
            exit 1
          fi

          echo "Uploading ${JAR} to ${NEXUS_RAW_REPO}${DIRECTORY}/"
          http_code=$(curl -sS -o /tmp/nexus-upload.out -w "%{http_code}" \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            -X POST "${NEXUS_URL}/service/rest/v1/components?repository=${NEXUS_RAW_REPO}" \
            -F "raw.directory=${DIRECTORY}" \
            -F "raw.asset1=@${JAR}" \
            -F "raw.asset1.filename=$(basename "${JAR}")")

          echo "Upload HTTP ${http_code}"
          if [ -s /tmp/nexus-upload.out ]; then
            cat /tmp/nexus-upload.out
            echo
          fi

          if [ "${http_code}" != "204" ] && [ "${http_code}" != "201" ] && [ "${http_code}" != "200" ]; then
            echo "::error::Failed to upload artifact to Nexus raw repo '${NEXUS_RAW_REPO}' (HTTP ${http_code})"
            exit 1
          fi

          echo "Published: ${NEXUS_URL}/repository/${NEXUS_RAW_REPO}${DIRECTORY}/$(basename "${JAR}")"
